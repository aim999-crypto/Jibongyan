name: Telegram Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"  # 06:15 BD
    - cron: "15 3 * * *"  # 09:15 BD
    - cron: "15 6 * * *"  # 12:15 BD
    - cron: "15 9 * * *"  # 15:15 BD
    - cron: "15 12 * * *" # 18:15 BD
    - cron: "15 15 * * *" # 21:15 BD

permissions:
  contents: write

concurrency:
  group: jibon-gyan-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render pending media
        run: python engine/render.py
      - name: Publish four posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher/telegram_bot.py
      - name: Commit queue and history
        run: |
          git config user.name "jibon-gyan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database/queue.json database/published.json
          git commit -m "Update Telegram publishing history" || echo "No changes"
          git push
