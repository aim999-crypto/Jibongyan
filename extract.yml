
name: Extract JIBON GYAN 365 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/jibonzip
          unzip -o jibon-gyan-365-project.zip -d /tmp/jibonzip
          cp -a /tmp/jibonzip/jibon-gyan-365/. .

      - name: Remove old publisher workflow
        run: |
          rm -f .github/workflows/main.yml

      - name: Save files
        run: |
          git config user.name "JIBON GYAN Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract JIBON GYAN 365 project"
          git push
